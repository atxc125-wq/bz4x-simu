<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BZ4X Trip Optimizer Pro - Waypoint Engine</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="chargers_data.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f172a; --panel: #1e293b; --border: #334155;
  --accent: #3b82f6; --accent2: #06b6d4;
  --text: #f1f5f9; --muted: #94a3b8;
  --radius: 12px;
}
body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; margin: 0; }

#app { display: flex; height: 100vh; overflow: hidden; }
#left { width: 360px; min-width: 320px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0; box-shadow: 4px 0 15px rgba(0,0,0,0.3); z-index: 10; }
#right { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }

@media (max-width: 860px) {
  #app { flex-direction: column; height: auto; overflow: visible; }
  #left { width: 100%; border-right: none; border-bottom: 1px solid var(--border); overflow-y: visible; box-shadow: none; }
  #right { flex: none; height: auto; display: flex; flex-direction: column; }
  #map { height: 50vh !important; min-height: 400px; }
  .chart-wrap { height: 350px !important; flex: none !important; }
}

.section { padding: 18px 20px; border-bottom: 1px solid var(--border); }
.field { margin-bottom: 12px; }
label { display: block; font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; font-weight: 600; }
input, select { width: 100%; background: #0f172a; border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 10px; font-size: 14px; transition: border 0.2s; }
input:focus, select:focus { outline: none; border-color: var(--accent2); }
#calc-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #3b82f6, #06b6d4); color: #fff; border: none; border-radius: 6px; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 12px rgba(6, 182, 212, 0.2); }
#calc-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(6, 182, 212, 0.4); }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
.stat { background: #0f172a; border-radius: 8px; padding: 10px 4px; text-align: center; border: 1px solid var(--border); }
.stat .val { font-size: 1.1rem; font-weight: 700; color: var(--accent2); margin-top: 4px; }
.stat .lbl { font-size: 0.6rem; }

.stop-item { background: #0f172a; border-radius: 8px; padding: 16px; margin-bottom: 12px; border-left: 4px solid #10b981; border: 1px solid var(--border); position: relative; }
.chg-specs { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.chg-chip { padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; }
.chip-kw { background: rgba(6, 182, 212, 0.15); color: var(--accent2); }
.chip-auth { background: rgba(59, 130, 246, 0.15); color: #93c5fd; }

.alt-charger-btn { background: #1e293b; border: 1px solid var(--border); color: var(--accent2); border-radius: 4px; padding: 5px 8px; font-size: 0.7rem; cursor: pointer; transition: 0.2s; }
.alt-list { display: none; margin-top: 8px; flex-direction: column; gap: 4px; }
.alt-opt { background: #0b1120; border: 1px solid var(--border); color: #f1f5f9; padding: 8px; font-size: 0.75rem; text-align: left; cursor: pointer; border-radius: 4px; }

#map { flex: 1.3; background: #1e293b; position: relative; }
.chart-wrap { padding: 16px 20px; background: var(--panel); flex: 0.7; position: relative; border-top: 1px solid var(--border); display: flex; flex-direction: column; }
.chart-container { flex: 1; position: relative; min-height: 0; }
.chart-ctrl { display: flex; gap: 4px; position: absolute; top: 12px; right: 20px; z-index: 10; }
.ctrl-btn { background: #334155; border: none; color: #fff; padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; transition: 0.2s; }
.ctrl-btn.active { background: var(--accent2); font-weight: bold; }

#loading { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9); z-index: 9999; align-items: center; justify-content: center; flex-direction: column; gap: 16px; backdrop-filter: blur(4px); }
#loading.show { display: flex; }
.spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent2); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div><div id="loading-msg">ルートを解析中...</div></div>
<div id="app">
  <div id="left">
    <div class="section">
        <h2 style="font-size:1.1rem; color:var(--text); display:flex; align-items:center; gap:8px;">
            BZ4X Trip Optimizer Pro
        </h2>
        <div id="db-status" style="margin-top: 4px;"></div>
    </div>
    <div class="section" style="padding-top:10px;">
        <div class="field"><input type="password" id="api-key" placeholder="API KEY" style="font-family:monospace; font-size:12px;"></div>
        <div class="stat-grid" style="grid-template-columns: 1fr 1fr; margin-bottom: 12px;">
            <div class="field" style="margin-bottom:0;"><label>予定日</label><input type="date" id="trip-date"></div>
            <div class="field" style="margin-bottom:0;"><label>出発時間</label><input type="time" id="start-time" value="08:00"></div>
        </div>
        <div class="field"><label>出発地</label><input type="text" id="origin" value="東京"></div>
        <div class="field"><label>目的地</label><input type="text" id="dest" value="大阪城"></div>
        <div class="stat-grid" style="grid-template-columns: 1fr 1fr;">
            <div class="field"><label>出発SOC (%)</label><input type="number" id="start-soc" value="100"></div>
            <div class="field"><label>充電閾値 (%)</label><input type="number" id="threshold-soc" value="25"></div>
        </div>
        <div class="field" style="margin-top:8px;">
            <label>表示</label>
            <select id="color-mode">
                <option value="soc">SOC残量 (パステルグラデーション)</option>
                <option value="speed">走行速度 (渋滞=赤 / 順調=青)</option>
            </select>
        </div>
        <button id="calc-btn">シミュレーション開始</button>
        <div id="dead-alert" style="display:none; background:rgba(239, 68, 68, 0.1); border:1px solid #ef4444; color:#fca5a5; padding:12px; border-radius:8px; margin-top:15px; font-size:0.8rem;"></div>
    </div>
    <div class="section" id="results" style="display:none; border-bottom:none;">
        <div class="stat-grid">
            <div class="stat"><div class="lbl">総所要時間</div><div class="val" id="r-eta">--:--</div></div>
            <div class="stat"><div class="lbl">到着SOC</div><div class="val" id="r-soc">--%</div></div>
            <div class="stat"><div class="lbl">平均気温</div><div class="val" id="r-temp">--℃</div></div>
        </div>
        <div id="stop-list" style="margin-top:20px"></div>
    </div>
  </div>
  <div id="right">
    <div id="map"></div>
    <div class="chart-wrap">
        <div class="chart-ctrl">
            <button class="ctrl-btn active" id="btn-time" onclick="setAxis('time')">時間</button>
            <button class="ctrl-btn" id="btn-dist" onclick="setAxis('dist')">距離</button>
        </div>
        <div class="chart-container">
            <canvas id="combo-chart"></canvas>
        </div>
    </div>
  </div>
</div>

<script>
let googleMap, directionsService, placesService, elevationService;
let chargerDB = (typeof CHARGER_DATA !== 'undefined') ? CHARGER_DATA : [];
let currentSim = null, currentDetailedPath = null, currentTripIsUpbound = false;
let routePolylines = [], comboChart = null, mapMarkers = [], emergencyMarkers = [];

// ユーザー設定の経由地（永続的）
let userWaypoints = []; 
// システムが自動で見つけた充電器（一時的だがWaypointsに反映）
let autoChargers = []; 

let userCustomDurations = {}; 
let userIgnoredChargers = []; 
let currentAxis = 'time';

Chart.defaults.color = '#94a3b8';
Chart.defaults.font.family = "'Segoe UI', sans-serif";

function initApp() {
    const dbStatusEl = document.getElementById('db-status');
    dbStatusEl.innerHTML = chargerDB.length > 0 ? `<span style="color:#10b981; font-size:10px;">✓ DB: ${chargerDB.length}件ロード済</span>` : `<span style="color:#ef4444; font-size:10px;">⚠️ DB未読み込み</span>`;

    googleMap = new google.maps.Map(document.getElementById('map'), {
        center: { lat: 35.6, lng: 139.0 }, zoom: 7,
        styles: [
            {elementType:'geometry',stylers:[{color:'#1e293b'}]},{featureType:'water',stylers:[{color:'#0f172a'}]},
            {featureType:'road',elementType:'geometry',stylers:[{color:'#334155'}]},{featureType:'road',elementType:'labels.text.fill',stylers:[{color:'#94a3b8'}]},
            {featureType:'poi',stylers:[{visibility:'off'}]}
        ],
        disableDefaultUI: true, zoomControl: true
    });
    directionsService = new google.maps.DirectionsService();
    elevationService = new google.maps.ElevationService();
    placesService = new google.maps.places.PlacesService(googleMap);
    
    new google.maps.places.Autocomplete(document.getElementById('origin'));
    new google.maps.places.Autocomplete(document.getElementById('dest'));
    
    document.getElementById('calc-btn').addEventListener('click', () => { 
        autoChargers = []; 
        userWaypoints = []; 
        userCustomDurations = {}; 
        userIgnoredChargers = []; 
        onCalculate(); 
    });
}

function getRouteColor(val, mode) {
    const pct = mode === 'speed' ? Math.max(0, Math.min(100, val)) : val;
    if (pct <= 20) return '#ef4444'; 
    if (pct <= 50) {
        const ratio = (pct - 20) / 30;
        return `rgb(${Math.round(239-(239-234)*ratio)}, ${Math.round(68+(179-68)*ratio)}, ${Math.round(68-(68-8)*ratio)})`;
    } else {
        const ratio = (pct - 50) / 50;
        return `rgb(${Math.round(234-(234-6)*ratio)}, ${Math.round(179+(182-179)*ratio)}, ${Math.round(8+(212-8)*ratio)})`;
    }
}

function haversine(l1, g1, l2, g2) {
    const R=6371, dL=(l2-l1)*Math.PI/180, dG=(g2-g1)*Math.PI/180;
    const a=Math.sin(dL/2)**2 + Math.cos(l1*Math.PI/180)*Math.cos(l2*Math.PI/180)*Math.sin(dG/2)**2;
    return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

async function fetchTemp(lat, lng, dateStr) {
    const d = dateStr ? new Date(dateStr) : new Date();
    const month = isNaN(d) ? 4 : d.getMonth() + 1;
    try {
        const url = `https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lng}&start_date=2023-${String(month).padStart(2,'0')}-01&end_date=2023-${String(month).padStart(2,'0')}-05&daily=temperature_2m_mean&timezone=Asia%2FTokyo`;
        const r = await fetch(url);
        const data = await r.json();
        return data.daily.temperature_2m_mean[0] || 15;
    } catch(e) { return 15; }
}

function getVehicleAcceptanceKw(soc) {
    const curve = [[0,115],[10,115],[20,135],[30,140],[40,135],[50,125],[60,110],[70,90],[80,75],[90,55],[100,45]];
    for (let i=0; i<curve.length-1; i++) {
        if (soc >= curve[i][0] && soc < curve[i+1][0]) {
            const ratio = (soc - curve[i][0]) / (curve[i+1][0] - curve[i][0]);
            return curve[i][1] + (curve[i+1][1] - curve[i][1]) * ratio;
        }
    }
    return 45;
}

// 充電シミュレーション
function calculateCharging(startSoc, durationMins, chargerInfo) {
    const batteryKwh = 71.4;
    let currentSoc = startSoc, maxDemanded = 0;
    const isFlash = chargerInfo.name.toUpperCase().includes('FLASH');
    const maxKw = parseInt(chargerInfo.powerKw) || 50;

    for (let t = 1; t <= durationMins; t++) {
        if (currentSoc >= 100) break;
        let vehicleMax = getVehicleAcceptanceKw(currentSoc);
        maxDemanded = Math.max(maxDemanded, vehicleMax);
        let chargerMax = maxKw;
        if (!isFlash && maxKw > 90) {
            if (t <= 15) chargerMax = maxKw;
            else if (t <= 25) chargerMax = maxDemanded > 130 ? 90 : 130;
            else chargerMax = 90;
        }
        currentSoc += (Math.min(vehicleMax, chargerMax) / 60) / batteryKwh * 100;
    }
    return Math.min(100, currentSoc);
}

async function runSimulation(segments, elevations, params, isUpboundTrip) {
    const { batteryKwh, startSocPct, thresholdSocPct, tripDate, startHour } = params;
    let socKwh = (startSocPct / 100) * batteryKwh, km = 0, time = 0;
    const profile = [], stops = [];
    let lastChargeKm = -999, lastWeatherKm = -999, curBaseTemp = 15;
    let isDead = false, deadLocation = null, warningLocation = null;
    const totalKm = segments.reduce((sum, s) => sum + s.distKm, 0);

    for (let i = 0; i < segments.length; i++) {
        const s = segments[i];
        const progress = km / totalKm;
        const currentElev = elevations[Math.min(elevations.length-1, Math.floor(progress * elevations.length))] || 0;
        
        if (km - lastWeatherKm >= 50) {
            curBaseTemp = await fetchTemp(s.lat, s.lng, tripDate);
            lastWeatherKm = km;
        }

        const localTemp = curBaseTemp - (currentElev / 100 * 0.6);
        const baseEff = Math.max(3.0, 8.5 - (s.speed * 0.025) - (Math.pow(s.speed, 2) * 0.0001));
        const heatingEnergy = (localTemp < 20 ? (20 - localTemp) * 0.15 : 0) * (s.distKm / s.speed);
        
        const energy = (s.distKm / baseEff) + heatingEnergy;
        let currentSoc = (socKwh / batteryKwh) * 100;

        if (currentSoc <= 20 && !warningLocation) warningLocation = { lat: s.lat, lng: s.lng };
        if (currentSoc <= 0) { isDead = true; deadLocation = { lat: s.lat, lng: s.lng }; break; }

        // ★ 自動充電器スキャンロジック（Waypoint化のトリガー）
        if (currentSoc < thresholdSocPct && (km - lastChargeKm) > 40) {
            // SA/PAは0.5km以内、FLASHは高速を降りる前提で7kmまでスキャン
            const found = chargerDB.find(c => {
                const dist = haversine(c.lat, c.lng, s.lat, s.lng);
                const isFlash = c.name.toUpperCase().includes('FLASH');
                const range = isFlash ? 7.0 : 0.5;
                const key = `${c.lat.toFixed(4)},${c.lng.toFixed(4)}`;
                return dist < range && !userIgnoredChargers.includes(key) && 
                       (c.name.includes('上り') === isUpboundTrip || c.name.includes('下り') !== isUpboundTrip || !c.name.match(/上り|下り/));
            });

            if (found) {
                const key = `${found.lat.toFixed(4)},${found.lng.toFixed(4)}`;
                // まだ経由地に追加されていなければ、追加してリルート発動
                if (!autoChargers.some(ac => ac.key === key)) {
                    autoChargers.push({ ...found, key });
                    return { requestReroute: true };
                }
            }
        }

        // ここでは「既にWaypointとして追加された充電器」に到達したときの充電処理のみを行う
        const reachedWp = autoChargers.find(ac => haversine(ac.lat, ac.lng, s.lat, s.lng) < 0.2);
        const reachedManual = userWaypoints.find(uw => haversine(uw.lat, uw.lng, s.lat, s.lng) < 0.2);
        const hit = reachedWp || reachedManual;

        if (hit && (km - lastChargeKm) > 5) {
            const duration = userCustomDurations[hit.key || `${hit.lat.toFixed(4)},${hit.lng.toFixed(4)}`] || 30;
            const socBefore = currentSoc;
            for(let t=1; t<=duration; t++) {
                currentSoc = calculateCharging(currentSoc, 1, hit);
                if(t%5===0 || t===duration) profile.push({ km, time: time + t, soc: currentSoc, speed: 0, elev: currentElev });
            }
            stops.push({ charger: hit, socBefore, socAfter: currentSoc, duration, time });
            time += duration;
            socKwh = (currentSoc/100)*batteryKwh;
            lastChargeKm = km;
        }

        socKwh -= energy;
        km += s.distKm; time += (s.distKm/s.speed)*60;
        profile.push({ km, time, soc: (socKwh/batteryKwh)*100, speed: s.speed, elev: currentElev });
    }
    return { profile, stops, arrivalSoc: isDead ? 0 : (socKwh/batteryKwh)*100, eta: time, isDead, deadLocation, warningLocation, avgTemp: 15 };
}

async function onCalculate() {
    showLoading('ルート最適化中...');
    const origin = document.getElementById('origin').value;
    const dest = document.getElementById('dest').value;

    // ★ 全ての充電器を経由地としてGoogle Mapsに投げる
    const combinedWps = [...userWaypoints, ...autoChargers].map(w => ({
        location: new google.maps.LatLng(w.lat, w.lng), stopover: true
    }));

    directionsService.route({ origin, destination: dest, waypoints: combinedWps, optimizeWaypoints: true, travelMode: 'DRIVING' }, async (res, status) => {
        if (status !== 'OK') return hideLoading() || alert('ルート解析失敗');

        // 上り下り判定
        const origLoc = res.routes[0].legs[0].start_location;
        const destLoc = res.routes[0].legs[res.routes[0].legs.length-1].end_location;
        currentTripIsUpbound = haversine(destLoc.lat(), destLoc.lng(), 35.68, 139.76) < haversine(origLoc.lat(), origLoc.lng(), 35.68, 139.76);

        currentDetailedPath = res.routes[0].legs.flatMap(l => l.steps.flatMap(s => s.path));
        const segments = res.routes[0].legs.flatMap(l => l.steps.map(s => ({
            distKm: s.distance.value/1000, speed: (s.distance.value/s.duration.value)*3.6||60, lat: s.start_location.lat(), lng: s.start_location.lng()
        })));

        elevationService.getElevationAlongPath({ path: res.routes[0].overview_path, samples: 250 }, async (elevRes) => {
            const elevations = elevRes ? elevRes.map(r => r.elevation) : new Array(250).fill(0);
            
            const result = await runSimulation(segments, elevations, {
                batteryKwh: 71.4, startSocPct: parseFloat(document.getElementById('start-soc').value),
                thresholdSocPct: parseFloat(document.getElementById('threshold-soc').value),
                tripDate: document.getElementById('trip-date').value, startHour: 8
            }, currentTripIsUpbound);

            // ★ リルートが必要な場合（新しい充電器が自動で見つかった場合）は再帰呼び出し
            if (result.requestReroute) return onCalculate();

            currentSim = result;
            hideLoading();
            renderUI();
        });
    });
}

function renderUI() {
    document.getElementById('results').style.display = 'block';
    document.getElementById('r-soc').textContent = currentSim.isDead ? '0%' : currentSim.arrivalSoc.toFixed(0) + '%';
    document.getElementById('r-eta').textContent = Math.floor(currentSim.eta/60) + 'h ' + Math.round(currentSim.eta%60) + 'm';
    
    const list = document.getElementById('stop-list'); list.innerHTML = '';
    currentSim.stops.forEach((st, idx) => {
        const div = document.createElement('div'); div.className = 'stop-item';
        const isFlash = st.charger.name.includes('FLASH');
        div.innerHTML = `
            <div style="font-weight:700; margin-bottom:5px;">${st.charger.name}</div>
            <div class="chg-specs">
                <span class="chg-chip chip-kw">⚡ ${st.charger.powerKw}kW</span>
                <span class="chg-chip chip-auth">${isFlash ? 'FLASH' : 'eMP'}</span>
            </div>
            <div style="font-size:11px; color:var(--muted); margin-bottom:10px;">到着 ${st.socBefore.toFixed(0)}% ➔ 出発 ${st.socAfter.toFixed(0)}%</div>
            <div style="display:flex; gap:8px;">
                <select onchange="updateChgTime('${st.charger.key || st.charger.lat+','+st.charger.lng}', this.value)" style="width:auto; padding:5px; font-size:11px;">
                    <option value="15" ${st.duration==15?'selected':''}>15分</option>
                    <option value="30" ${st.duration==30?'selected':''}>30分</option>
                    <option value="45" ${st.duration==45?'selected':''}>45分</option>
                    <option value="60" ${st.duration==60?'selected':''}>60分</option>
                </select>
                <button class="alt-charger-btn" onclick="removeChg('${st.charger.key || st.charger.lat+','+st.charger.lng}')">✖ 削除</button>
            </div>
        `;
        list.appendChild(div);
    });

    updateMapDrawing();
    drawMarkers();
    drawComboChart();
}

window.updateChgTime = (key, mins) => { userCustomDurations[key] = parseInt(mins); onCalculate(); };
window.removeChg = (key) => { 
    userIgnoredChargers.push(key); 
    autoChargers = autoChargers.filter(ac => ac.key !== key);
    userWaypoints = userWaypoints.filter(uw => (uw.key || uw.lat+','+uw.lng) !== key);
    onCalculate(); 
};
window.setAxis = (a) => { currentAxis = a; document.getElementById('btn-time').classList.toggle('active', a==='time'); document.getElementById('btn-dist').classList.toggle('active', a==='dist'); drawComboChart(); };

function updateMapDrawing() {
    routePolylines.forEach(p => p.setMap(null)); routePolylines = [];
    const chunks = 100;
    const pointsPerChunk = Math.ceil(currentDetailedPath.length / chunks);
    for (let i = 0; i < chunks; i++) {
        const startIdx = i * pointsPerChunk;
        const endIdx = Math.min((i + 1) * pointsPerChunk, currentDetailedPath.length - 1);
        if (startIdx >= endIdx) break;
        const soc = currentSim.profile[Math.min(currentSim.profile.length-1, Math.floor((startIdx/currentDetailedPath.length)*currentSim.profile.length))].soc;
        routePolylines.push(new google.maps.Polyline({
            path: currentDetailedPath.slice(startIdx, endIdx + 2), strokeColor: getRouteColor(soc, 'soc'), strokeWeight: 6, map: googleMap
        }));
    }
    const bounds = new google.maps.LatLngBounds();
    currentDetailedPath.filter((_,i)=>i%20===0).forEach(p => bounds.extend(p));
    googleMap.fitBounds(bounds);
}

function drawMarkers() {
    mapMarkers.forEach(m => m.setMap(null)); mapMarkers = [];
    const addMarker = (pos, lbl, color) => {
        mapMarkers.push(new google.maps.Marker({ position: pos, map: googleMap, label: {text: lbl, color: 'white'}, icon: color ? {path:google.maps.SymbolPath.CIRCLE, scale:10, fillColor:color, fillOpacity:1, strokeColor:'white'} : null }));
    };
    addMarker(currentDetailedPath[0], 'S', '#3b82f6');
    addMarker(currentDetailedPath[currentDetailedPath.length-1], 'G', '#ef4444');
    currentSim.stops.forEach(st => {
        mapMarkers.push(new google.maps.Marker({
            position: {lat: st.charger.lat, lng: st.charger.lng}, map: googleMap, 
            icon: {path: "M7 2v11h3v9l7-12h-4l4-8z", fillColor: "#10b981", fillOpacity: 1, scale: 1.2, strokeColor: "white", strokeWeight: 1}
        }));
    });
}

function drawComboChart() {
    if (comboChart) comboChart.destroy();
    const ctx = document.getElementById('combo-chart').getContext('2d');
    const chartData = currentSim.profile.map(p => ({ x: currentAxis==='time'?p.time:p.km, y: p.soc }));
    const elevData = currentSim.profile.map(p => ({ x: currentAxis==='time'?p.time:p.km, y: p.elev }));
    
    comboChart = new Chart(ctx, {
        type: 'line',
        data: {
            datasets: [{
                data: chartData, yAxisID: 'y', borderWidth: 3, pointRadius: 0, tension: 0.3, fill: true, backgroundColor: 'rgba(59, 130, 246, 0.1)',
                borderColor: (context) => {
                    const chart = context.chart; const {ctx, chartArea} = chart;
                    if (!chartArea) return '#3b82f6';
                    const gradient = ctx.createLinearGradient(0, chartArea.bottom, 0, chartArea.top);
                    gradient.addColorStop(0, '#ef4444'); gradient.addColorStop(0.5, '#eab308'); gradient.addColorStop(1, '#06b6d4');
                    return gradient;
                }
            }, {
                data: elevData, yAxisID: 'y1', borderColor: 'rgba(148, 163, 184, 0.4)', borderWidth: 1, pointRadius: 0, fill: true, backgroundColor: 'rgba(148, 163, 184, 0.05)'
            }]
        },
        options: {
            responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
            scales: {
                x: { type: 'linear', ticks: { callback: v => currentAxis==='time'?Math.floor(v/60)+'h'+Math.round(v%60)+'m' : v.toFixed(0)+'km' } },
                y: { min: 0, max: 100 }, y1: { position: 'right', display: true, grid: { drawOnChartArea: false } }
            }
        }
    });
}

window.onload = () => {
    const key = localStorage.getItem('gmaps_key');
    if (key) {
        document.getElementById('api-key').value = key;
        const s = document.createElement('script');
        s.src = `https://maps.googleapis.com/maps/api/js?key=${key}&libraries=places,geometry&callback=initApp`;
        document.head.appendChild(s);
    }
    document.getElementById('api-key').addEventListener('change', (e) => { localStorage.setItem('gmaps_key', e.target.value); location.reload(); });
    document.getElementById('trip-date').value = new Date().toISOString().split('T')[0];
};
</script>
</body>
